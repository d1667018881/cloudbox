# ============================================================
# CloudBox 自动构建
# 触发：push 到 main / 手动触发（workflow_dispatch）
# 产物：release APK 直接发布到 GitHub Release（避开 artifact 配额）
# 签名：debug/release 共用 app/keystore/cloudbox-release.keystore（签名一致，可覆盖安装）
# ============================================================
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK components
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Build release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify APK signature
        run: |
          apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk
          # 输出 SHA256 应与 keystore 一致（F3:F6:BB:C6:...），保证可覆盖安装

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.0-$(date +%Y%m%d%H%M)"
          gh release create "$TAG" \
            app/build/outputs/apk/release/app-release.apk \
            --repo "${{ github.repository }}" \
            --title "CloudBox $TAG" \
            --notes "自动构建 release APK

- 签名：cloudbox-release.keystore（与本地 debug/release 一致，可覆盖安装）
- 安装包：app-release.apk" \
            --latest
