name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install SDK
        run: |
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Verify signature
        run: apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v0.1.0-$(date +%Y%m%d%H%M)"
          gh release create "$TAG" app/build/outputs/apk/release/app-release.apk --repo "${{ github.repository }}" --title "CloudBox $TAG" --notes "Auto build APK" --latest
