name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ⚠️ 不再使用 android-actions/setup-android@v3（2026-09-15）。
      #
      # 原因：它是第三方 action，GitHub Runner 拉取它偶发失败，
      # 失败时**日志目录还没建立**（tee 还没开始），只留下
      # "Run android-actions/setup-android@v3 -> failure"，完全看不出原因，
      # 排查成本极高（本次连挂两次）。
      #
      # ubuntu-latest runner 自身已预装 Android SDK，只需要把路径与环境
      # 变量显式设好即可，省掉一个外部依赖。
      - name: Setup Android SDK (built-in)
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          # sdkmanager 位于 cmdline-tools 下，逐层找（不同 runner 镜像路径略有差异）
          CMDLINE=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$CMDLINE" ]; then
            CMDLINE=$(find "$SDK" -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "sdkmanager 位置：$CMDLINE"
          echo "已安装的平台："; ls "$SDK/platforms" 2>/dev/null || true
          if [ -n "$CMDLINE" ]; then
            echo "$(dirname "$CMDLINE")" >> "$GITHUB_PATH"
          fi

      - name: Install SDK
        run: |
          # runner 预装的版本通常已满足；缺失才装，装不上不阻断（gradle 会自己下）
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" || true
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.9

      # 交付前体检（秒级）。放在 gradle 之前 —— 少个括号/多个 import 这类
      # 手误本可以立刻发现，没必要白等 3~4 分钟的完整构建。
      # 检查范围与规则见 scripts/precheck.py；它能抓到什么、抓不到什么都写在文件头。
      # ⚠️ 不用 `|| true` 吞掉失败：这一步失败就应该整轮失败，
      #    否则它跟不存在没区别（§35 批评过"形同虚设的守卫"）。
      #
      # 输出追加进 build.log：`if: always()` 的日志上传只抓 build.log，
      # 体检结果不写进去就无从确认它到底跑没跑 —— 而"不确定有没有执行"
      # 的守卫等于没有守卫。用 >> 追加，别用 >（会清掉 gradle 在后面写的内容）。
      - name: Pre-check (fast)
        run: |
          # 一次扫全仓库，两种检查都做（括号/import 只作用于 .kt，
          # 凭据扫描覆盖 .md 等文档 —— 历史上的口令泄露就发生在文档里）。
          # 只传 `.` 而不是分两步：`.kt` 是仓库的子集，扫两次纯属浪费。
          echo "===== precheck（语法 + 凭据） =====" | tee -a build.log
          python3 scripts/precheck.py . 2>&1 | tee -a build.log

      - name: Build APK
        id: build
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "0.1.${{ github.run_number }}"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        # tee 保留完整输出，供下一步失败时留存；PIPESTATUS 保证 gradle 的真实退出码不被管道吞掉
        #
        # ⚠️ 必须是 `tee -a`（追加）而不是 `tee`（覆盖）：
        #    上面的 Pre-check 步骤已经把体检结果写进 build.log 了，
        #    这里用覆盖会把那段冲掉 —— 于是"守卫跑没跑过"又变成不可验证。
        run: |
          set +e
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee -a build.log
          code=${PIPESTATUS[0]}
          echo "gradle_exit=$code" >> "$GITHUB_OUTPUT"
          exit $code

      # 失败排查用：GitHub 的 Actions 日志下载域名常被网络劫持拿不到，
      # 这里把日志推到 ci-logs 孤儿分支，用 raw.githubusercontent.com 就能读。
      # 不需要时可整段删除，不影响 APK 产物。
      - name: Publish build log (debug)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          mkdir -p .ci
          tail -c 400000 build.log > .ci/build.log 2>/dev/null
          [ -s .ci/build.log ] || echo "(no build.log captured)" > .ci/build.log
          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f .ci/build.log
          git commit -m "ci log run ${{ github.run_number }} (${{ github.sha }})" 
          git push -f origin ci-logs
          echo "log branch pushed"
          exit 0

      - name: Verify signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk
          # 输出 SHA256 应与 keystore 一致（F3:F6:BB:C6:13:BF:C8:80...），保证可覆盖安装

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
          # 发行说明来源：事件载荷里的**原始** commit message（push 触发时必有）。
          # 为什么不用 git log -1：本 job 的 "Publish build log" 步骤会把 HEAD
          # 移到 ci-logs 分支并新建一个 ci-bot 提交（v0.1.184 实锤——发行说明
          # 变成了 "ci log run 184"）。事件载荷不受工作区 git 状态污染。
          # 经 env 传入而非内插进命令：message 含引号/反引号/$ 也不会被 bash 展开。
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG="v0.1.${{ github.run_number }}"

          # ── 资产名：软件名 + 版本号（2026-09-26 用户要求，不再用 gradle 默认的
          #    app-release.apk —— 下载到手机里一堆同名文件分不清谁是谁）。
          #    与 release 标题/tag 同源（TAG 就是唯一版本来源），不会出现
          #    文件名与发行版号对不上的情况。
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_NAME="CloudBox-$TAG.apk"
          cp "$APK_SRC" "$APK_NAME"

          # ── 发行说明：本次构建对应的 commit message（约定见 AI_MAINTENANCE §41：
          #    任何 AI/人提交时都会写 commit message，说明质量搭在提交纪律上，
          #    换接手者无需记忆额外约定）。
          # push 触发用 COMMIT_MSG（事件载荷，首选路径）；workflow_dispatch 无
          # head_commit 时 fallback 到 git log -1（此时可能是 ci-logs 的日志
          # 提交，可接受——dispatch 是手动补构建，说明价值本就有限）。
          # 统一压掉前导空行与连续空行；全空兜底"自动构建"。
          NOTES="${COMMIT_MSG:-$(git log -1 --pretty=format:"%s%n%n%b")}"
          NOTES=$(printf '%s' "$NOTES" | sed '/./,$!d' | awk 'BEGIN{blank=0} /^[[:space:]]*$/{blank++; if(blank>1) next} {blank=0; print}')
          [ -z "$NOTES" ] && NOTES="自动构建"

          gh release create "$TAG" "$APK_NAME" \
            --repo "${{ github.repository }}" \
            --title "CloudBox $TAG" \
            --notes "$NOTES" --latest
